{% load i18n %}
<div class="toolbar">
  <div class="toolbar-section hidden-xs">
    <div class="toolbar-item">
      <div class="dropdown">
        <button class="btn btn-default btn-outline btn-icon" title="{%trans 'Shortcuts' %}" type="button" disabled>
          <span class="material-icon">bookmark</span>
        </button>
      </div>
    </div>
    <div class="toolbar-item">
      {% include "misago/thread/pagination.html"%}
    </div>
    <div class="toolbar-item">
    <select id="limitSwitch" class="btn btn-default" ><option value="">Post Limit</option>
    <option value="1" {% if request.session.posts_per_page == 1 %}selected="selected"{% endif %} >1</option>   
     <option value="5" {% if request.session.posts_per_page == 5 %}selected="selected"{% endif %}>5</option>
      <option value="10" {% if request.session.posts_per_page == 10 %}selected="selected"{% endif %}>10</option> 
      <option value="20" {% if request.session.posts_per_page == 20 %}selected="selected"{% endif %}>20</option>
    <option value="30"{% if request.session.posts_per_page == 30 %}selected="selected"{% endif %}>30</option>
      <option value="40" {% if request.session.posts_per_page == 40 %}selected="selected"{% endif %}>40</option>
      <option value="50" {% if request.session.posts_per_page == 50 %}selected="selected"{% endif %}>50</option>
    </select>
    </div>
  </div>
  <div class="toolbar-spacer"></div>
  {% if user.is_authenticated %}
    {% if thread.acl.can_start_poll %}
      <div class="toolbar-section hidden-xs">
        <div class="toolbar-item">
          <button class="btn btn-default btn-outline btn-block" type="button" disabled>
            <span class="material-icon">poll</span>
            {% trans 'Add poll' %}
          </button>
        </div>
      </div>
    {% endif %}
    <div class="toolbar-section">
      <div class="toolbar-item hidden-sm hidden-md hidden-lg toolbar-item-shrink">
        <div class="dropdown">
          <button class="btn btn-default btn-outline btn-icon" title="{% trans 'Shortcuts' %}" type="button" disabled>
            <span class="material-icon">bookmark</span>
          </button>
        </div>
      </div>
      {% if thread.acl.can_reply %}
        <div class="toolbar-item">
          <button class="btn btn-primary btn-outline btn-block" type="button" disabled>
            <span class="material-icon">chat</span>
            {% trans 'Reply' %}
          </button>
        </div>
      {% endif %}
      {% if thread.acl.can_start_poll %}
        <div class="toolbar-item hidden-sm hidden-md hidden-lg toolbar-item-shrink">
          <button class="btn btn-default btn-outline btn-icon" title="{% trans 'Add poll' %}" type="button" disabled>
            <span class="material-icon">poll</span>
          </button>
        </div>
      {% endif %}
    </div>
  {% endif %}
</div>
